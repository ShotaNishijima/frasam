url: https://ichimomo.github.io/frasam/
template:
  bootstrap: 5
  bootswatch: flatly

navbar:
  structure:
    left: [home, reference, articles, news]
    right: [github]
  components:
    github:
      icon: fa-github
      href: https://github.com/ichimomo/frasam

reference:
  - title: "Main functions"
    contents:
      - starts_with("your_main_function_prefix")

articles:
  - title: "Vignettes"
    contents:
      - matches(".*")